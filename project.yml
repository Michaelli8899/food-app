# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   xcodegen generate
# then open BiteLog.xcodeproj
name: BiteLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  BiteLog:
    type: application
    platform: iOS
    sources:
      - BiteLog
    info:
      path: BiteLog/Info.plist
      properties:
        CFBundleDisplayName: Bite Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Bite Log uses the camera so you can snap a photo of your meal.
        NSPhotoLibraryUsageDescription: Bite Log lets you pick meal photos from your library.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bitelog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  BiteLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BiteLogTests
    dependencies:
      - target: BiteLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bitelog.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BiteLog:
    build:
      targets:
        BiteLog: all
        BiteLogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BiteLogTests
